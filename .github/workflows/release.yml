name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Rerun all release gates and publish a new immutable tag
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*-portals.*"

permissions: {}

jobs:
  publish-tag:
    name: Validate and publish immutable tag
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: publish-lore-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install release tools
        run: |
          rustup toolchain uninstall 1.97.0
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          python -m pip install uv==0.10.12
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: candidate
          cache-on-failure: true
      - name: Run gates and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          BASE_BRANCH="${VERSION%%-portals.*}"
          test "$GITHUB_REF" = "refs/heads/$BASE_BRANCH"
          git switch "$BASE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release-local.sh "v$VERSION" --publish
          # Tags pushed by GITHUB_TOKEN do not trigger push workflows. Explicit
          # dispatch runs the canonical signed build at the new immutable tag.
          gh workflow run release.yml --ref "v$VERSION" -f publish=false

  test:
    name: Test release source
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          # Refresh the hosted image's partially registered toolchain before
          # installing the components required by rust-toolchain.toml.
          rustup toolchain uninstall 1.97.0
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          python -m pip install uv==0.10.12
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test
      - name: Verify tag and build release binaries
        shell: bash
        env:
          LORE_BUILD_VERSION_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          CARGO_INCREMENTAL=0 cargo build --locked --release \
            -p lore-client --bin lore \
            -p lore-server --bin loreserver
      - name: Run Rust tests
        env:
          LORE_BUILD_VERSION_NAME: ${{ github.ref_name }}
        run: >-
          cargo test --locked --release
          -p lore-credential
          -p lore-server
      - name: Run CLI/server integration tests
        env:
          LORE_SMOKE_BATCH_SIZE: "8"
        run: scripts/run-smoke-tests.sh

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Rust target
        shell: bash
        run: |
          # Refresh the hosted image's partially registered toolchain before
          # installing the components required by rust-toolchain.toml.
          rustup toolchain uninstall 1.97.0
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-${{ matrix.target }}
      - name: Build Lore binaries
        shell: bash
        timeout-minutes: 300
        env:
          LORE_BUILD_VERSION_NAME: ${{ github.ref_name }}
        run: >-
          cargo build --locked --profile release-lto
          --target "${{ matrix.target }}"
          -p lore-client --bin lore
          -p lore-server --bin loreserver
      - name: Package Unix artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts package/lore package/loreserver
          cp "target/${{ matrix.target }}/release-lto/lore" package/lore/lore
          cp "target/${{ matrix.target }}/release-lto/loreserver" package/loreserver/loreserver
          tar -C package/lore -czf "artifacts/lore-${VERSION}-${{ matrix.target }}.tar.gz" lore
          tar -C package/loreserver -czf "artifacts/loreserver-${VERSION}-${{ matrix.target }}.tar.gz" loreserver
      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release-lto/lore.exe" `
            -DestinationPath "artifacts/lore-$Version-${{ matrix.target }}.zip"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release-lto/loreserver.exe" `
            -DestinationPath "artifacts/loreserver-$Version-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lore-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add installers and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 artifacts/
          chmod +x artifacts/install.sh
          cd artifacts
          sha256sum lore-* loreserver-* install.sh install.ps1 > SHA256SUMS
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign checksum manifest
        working-directory: artifacts
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
