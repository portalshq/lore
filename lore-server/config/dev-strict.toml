# Strict-mode development profile with production-parity JWKS trust.
# Use this when LORE_SECURITY_MODE=strict. For a private dev CA (e.g.
# auth.dev.example.com with a self-signed CA generated by
# control-plane/auth-gateway/scripts/setup-dev-auth.sh), set ca_file to the
# CA bundle. For a publicly trusted certificate, omit ca_file.
#
# Start Lore strict with:
#   LORE_ENV=dev LORE_SECURITY_MODE=strict \
#   lore-server --config lore-server/config
#
# This file is layered over config/default.toml via Settings::load.

[server.auth]
jwt_issuer = "https://auth.dev.example.com"
jwt_audience = ["lore", "portals.works"]

[server.auth.jwk]
endpoint = "https://auth.dev.example.com/.well-known/jwks.json"
refresh_interval_seconds = 60
max_stale_seconds = 600
# Private-CA trust — omit for publicly trusted certs:
ca_file = "/Users/vibrantceo/Library/Application Support/Portals/Lore/auth/dev-root-ca.pem"

[server.quic]
enabled = false

[server.grpc]
enabled = true
verify_client_certs = false

[server.grpc_public_services]
admin_service_enabled = false

[server.http]
store_health_check = true
